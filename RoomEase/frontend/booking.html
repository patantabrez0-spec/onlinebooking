<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a stay | RoomEase</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/app.js"></script>
  <script defer src="/js/booking.js"></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark">R</span>RoomEase</a><nav class="main-nav" aria-label="Main navigation"><a href="/rooms.html">Explore stays</a><a href="/my-bookings.html">My bookings</a><a href="/login.html" data-guest-link>Sign in</a><a class="button button-small" href="/register.html" data-guest-link>Get started</a><span class="nav-user" data-user-name hidden></span><button class="button button-small button-outline" data-logout hidden>Sign out</button></nav></header>
  <main class="page-main narrow-main">
    <a class="back-link" href="/rooms.html">← Back to rooms</a>
    <section class="content-card">
      <p class="eyebrow">Your getaway</p><h1>Book your stay</h1>
      <div id="booking-room" class="booking-room"><p class="muted">Loading room...</p></div>
      <form id="booking-form" class="form-stack">
        <div class="form-row">
          <label>Check-in<input name="checkIn" type="date" required></label>
          <label>Check-out<input name="checkOut" type="date" required></label>
        </div>
        <label>Guests<input name="guests" type="number" min="1" value="1" required></label>
        <p id="booking-total" class="price-summary muted">Select your dates to estimate your total.</p>
        <button class="button button-full" type="submit">Request booking</button>
      </form>
      <p id="booking-message" class="message" aria-live="polite"></p>
    </section>
  </main>
  <footer class="site-footer"><a class="brand" href="/"><span class="brand-mark">R</span>RoomEase</a><p>Make yourself at home, wherever you go.</p></footer>
</body>
</html>
