<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | RoomEase</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/app.js"></script>
  <script defer src="/js/auth.js"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">R</span>RoomEase</a>
    <a class="text-link" href="/register.html">Create an account <span aria-hidden="true">→</span></a>
  </header>
  <main class="auth-layout">
    <section class="auth-aside"><p class="eyebrow">Welcome back</p><h1>Your next stay is just around the corner.</h1><p>Sign in to pick up where you left off and keep every trip in one place.</p><span class="aside-decoration" aria-hidden="true">R</span></section>
    <section class="auth-card">
      <p class="eyebrow">RoomEase account</p><h2>Sign in</h2><p class="muted">Enter your details to continue.</p>
      <form id="login-form" class="form-stack">
        <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label>
        <button class="button button-full" type="submit">Sign in</button>
      </form>
      <p id="auth-message" class="message" aria-live="polite"></p>
      <p class="form-footnote">New to RoomEase? <a href="/register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
