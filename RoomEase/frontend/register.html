<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | RoomEase</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/app.js"></script>
  <script defer src="/js/auth.js"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">R</span>RoomEase</a>
    <a class="text-link" href="/login.html">Already a member? Sign in <span aria-hidden="true">→</span></a>
  </header>
  <main class="auth-layout">
    <section class="auth-aside"><p class="eyebrow">Make room for a getaway</p><h1>Good trips begin with a place to land.</h1><p>Create your account to discover rooms and manage your bookings with ease.</p><span class="aside-decoration" aria-hidden="true">R</span></section>
    <section class="auth-card">
      <p class="eyebrow">Get started</p><h2>Create your account</h2><p class="muted">It only takes a moment.</p>
      <form id="register-form" class="form-stack">
        <label>Full name<input name="name" type="text" autocomplete="name" required minlength="2" maxlength="80"></label>
        <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"><small>Use at least 8 characters.</small></label>
        <button class="button button-full" type="submit">Create account</button>
      </form>
      <p id="auth-message" class="message" aria-live="polite"></p>
      <p class="form-footnote">Already have an account? <a href="/login.html">Sign in</a></p>
    </section>
  </main>
</body>
</html>
